<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="memory-indicator" id="memory-indicator"></div>
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="memory-row">
            <button class="memory" id="memory-clear">MC</button>
            <button class="memory" id="memory-recall">MR</button>
            <button class="memory" id="memory-add">M+</button>
            <button class="memory" id="memory-subtract">M-</button>
            <button class="memory" id="memory-store">MA</button>  
            <button class="memory" id="memory-clear-all">MCA</button>  
                </div>
        <button class="span-two" id="clear">AC</button>
        <button class="operation" id="delete">DEL</button>
        <button class="operation" id="divide">÷</button>
        <button class="advanced" id="square-root">√</button>
        <button class="advanced" id="percentage">%</button>
        <button class="number" id="9">9</button>
        <button class="operation" id="multiply">×</button>
        <button class="number" id="7">7</button>
        <button class="number" id="8">8</button>
        <button class="number" id="6">6</button>
        <button class="operation" id="subtract">-</button>
        <button class="number" id="4">4</button>
        <button class="number" id="5">5</button>
        <button class="number" id="3">3</button>
        <button class="operation" id="add">+</button>
        <button class="number" id="1">1</button>
        <button class="number" id="2">2</button>
        <button class="number" id="0">0</button>
        <button class="number" id="decimal">.</button>
        <button class="span-two" id="equals">=</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
